name: Build and publish environment images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Base image tag for parent references'
        required: true
        default: 'v1.0.0'

env:
  REGISTRY: ghcr.io/nukehub-dev

jobs:
  build:
    name: Build and publish environment images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: version
        run: |
          ref="${GITHUB_REF:-refs/heads/main}"
          sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          short_sha="${sha:0:7}"
          case "$ref" in
            refs/tags/v*.*.*)
              tag="${ref#refs/tags/v}"
              ;;
            refs/heads/main)
              tag="main"
              ;;
            refs/heads/*)
              tag="${ref#refs/heads/}"
              tag="${tag//[^a-zA-Z0-9_.-]/-}"
              ;;
            refs/pull/*/merge)
              tag="${ref#refs/pull/}"
              tag="${tag%/merge}"
              tag="pr-$tag"
              ;;
            *)
              tag="sha-$short_sha"
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build images
        if: github.event_name == 'pull_request'
        run: ./scripts/build.sh all --parallel
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_TAG: ${{ github.event.inputs.base_tag || 'latest' }}
          TOOLCHAIN_VERSION: ${{ github.event.inputs.base_tag || 'latest' }}
          CONTAINER_ENGINE: docker

      - name: Build and push images
        if: github.event_name != 'pull_request'
        run: ./scripts/build.sh all --parallel --push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_TAG: ${{ github.event.inputs.base_tag || (startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.tag) || 'latest' }}
          SHA_TAG: ${{ steps.version.outputs.sha_tag }}
          TOOLCHAIN_VERSION: ${{ steps.version.outputs.tag }}
          CONTAINER_ENGINE: docker
