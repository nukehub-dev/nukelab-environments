name: Build and publish environment images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Parent image tag to build against'
        required: true
        default: 'v1.0.0'

env:
  REGISTRY: ghcr.io

jobs:
  matrix:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - nuclear-base
          - radiation-transport
          - moose
          - cardinal
          - openfoam
          - gpu-toolkit
        include:
          - image: nuclear-base
            parent: ghcr.io/nukelab/conda-base
          - image: radiation-transport
            parent: ghcr.io/nukelab/nuclear-base
          - image: moose
            parent: ghcr.io/nukelab/nuclear-base
          - image: cardinal
            parent: ghcr.io/nukelab/moose
          - image: openfoam
            parent: ghcr.io/nukelab/conda-base
          - image: gpu-toolkit
            parent: ghcr.io/nukelab/conda-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/nukelab/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.parent }}:${{ github.event.inputs.base_tag || 'v1.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
